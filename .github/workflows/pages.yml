# Publishes exactly what is committed on main (tracked files only — no uncommitted local files).
# Repo: https://github.com/nileshgolande/Static_Portfolio
#
# One-time setup on GitHub:
#   Settings → Pages → Build and deployment → Source: GitHub Actions
#
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export site from git (tracked files at HEAD only)
        run: |
          mkdir -p site
          git archive HEAD | tar -x -C site
          rm -rf site/.github
          touch site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
